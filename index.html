<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div style = "display: flex;
    background-color: hsl(212, 45%, 89%);
    justify-content: center;
    align-items: center;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;">
    <div style = "display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: white;
    border-radius: 10px;
    padding: 15px;
    height: 400px;
    width: 250px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);"
    >
      <div style = " 
        width: 100%;
        display:block;
        ">
          <img src="./images/image-qr-code.png" alt="QR code" style = "width: 100%;
          border-radius: 10px;">
      </div>
      <div style = "width: 220px;
      text-align: center;">
        <h2 style = "font-size: 18px;
        font-weight: 700;
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        color: hsl(218, 44%, 22%);
        margin-top: 15px;
        margin-bottom: 10px;">Improve your front-end skills by building projects</h2>
        <p style = "font-size: 14px;
        font-family: 'Outfit', sans-serif;
        font-weight: 400;
        color: hsl(216, 15%, 48%);
        line-height: 1.5;">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>





    </div>



  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Joseph Omoruyi</a>.
  </footer>
</body>
</html>
